<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0a" rx="12"/>
  
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- G -->
  <text x="25" y="75" font-family="Inter, -apple-system, system-ui" font-size="52" font-weight="bold" fill="#06E6FF" filter="url(#glow)">G</text>
  
  <!-- T -->
  <text x="55" y="75" font-family="Inter, -apple-system, system-ui" font-size="52" font-weight="bold" fill="#06E6FF" filter="url(#glow)">T</text>
  
  <!-- Accent line -->
  <line x1="20" y1="85" x2="80" y2="85" stroke="#06E6FF" stroke-width="2" opacity="0.6"/>
</svg>